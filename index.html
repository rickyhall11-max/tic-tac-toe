<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic-Tac-Toe Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="badge">Antigravity &times; VS Code Demo</div>
      <h1>Tic-Tac-Toe</h1>
      <p class="subtitle">A sleek modern implementation built with Antigravity</p>
    </header>

    <div class="game-card">
      <div class="scoreboard">
        <div class="score-item" id="score-x">
          <span class="player-tag">Player X</span>
          <span class="score-val" id="val-x">0</span>
        </div>
        <div class="score-item" id="score-ties">
          <span class="player-tag">Ties</span>
          <span class="score-val" id="val-ties">0</span>
        </div>
        <div class="score-item" id="score-o">
          <span class="player-tag">Player O</span>
          <span class="score-val" id="val-o">0</span>
        </div>
      </div>

      <div class="status-bar">
        <div class="turn-indicator" id="turn-indicator">
          Player <span id="current-player" class="player-x">X</span>'s Turn
        </div>
        <div class="mode-select">
          <button class="mode-btn active" id="mode-pvp" title="Two Players">2P Local</button>
          <button class="mode-btn" id="mode-ai" title="Play against Smart AI">vs AI</button>
        </div>
      </div>

      <div class="board" id="board" role="grid" aria-label="Tic-Tac-Toe Board">
        <button class="cell" data-index="0" aria-label="Cell 1"></button>
        <button class="cell" data-index="1" aria-label="Cell 2"></button>
        <button class="cell" data-index="2" aria-label="Cell 3"></button>
        <button class="cell" data-index="3" aria-label="Cell 4"></button>
        <button class="cell" data-index="4" aria-label="Cell 5"></button>
        <button class="cell" data-index="5" aria-label="Cell 6"></button>
        <button class="cell" data-index="6" aria-label="Cell 7"></button>
        <button class="cell" data-index="7" aria-label="Cell 8"></button>
        <button class="cell" data-index="8" aria-label="Cell 9"></button>
      </div>

      <div class="actions">
        <button id="restart-btn" class="btn primary-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg>
          Reset Match
        </button>
        <button id="reset-scores-btn" class="btn text-btn">Reset Scores</button>
      </div>
    </div>

    <!-- Victory / Draw Modal Overlay -->
    <div class="modal-backdrop" id="modal-backdrop">
      <div class="modal">
        <div class="modal-icon" id="modal-icon">🏆</div>
        <h2 id="modal-title">Player X Wins!</h2>
        <p id="modal-message">Brilliant move! Ready for the next round?</p>
        <button id="modal-play-again" class="btn primary-btn">Play Next Round</button>
      </div>
    </div>

    <footer>
      Built with ⚡ in VS Code powered by Antigravity
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
